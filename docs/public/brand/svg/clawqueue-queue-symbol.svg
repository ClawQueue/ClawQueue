<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Queue dial">
  <title>Queue dial</title>
  <defs>
    <linearGradient id="q_dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE0FF"/>
      <stop offset="1" stop-color="#0EA8DD"/>
    </linearGradient>
    <radialGradient id="q_glow" cx=".5" cy=".5" r=".55">
      <stop offset=".55" stop-color="#5BE0FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#1EC6FF" stop-opacity=".55"/>
    </radialGradient>
  </defs>
  <g transform="translate(64 64)">
    <circle r="58" fill="url(#q_glow)"/>
    <circle r="50" fill="#03143A"/>
    <circle r="42" fill="url(#q_dial)"/>
    <g stroke="#03143A" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="0" y1="-36" x2="0" y2="-28"/>
      <line x1="25.5" y1="-25.5" x2="20" y2="-20"/>
      <line x1="36" y1="0" x2="28" y2="0"/>
      <line x1="25.5" y1="25.5" x2="20" y2="20"/>
      <line x1="0" y1="36" x2="0" y2="28"/>
      <line x1="-25.5" y1="25.5" x2="-20" y2="20"/>
      <line x1="-36" y1="0" x2="-28" y2="0"/>
      <line x1="-25.5" y1="-25.5" x2="-20" y2="-20"/>
    </g>
    <line x1="0" y1="0" x2="19" y2="-24" stroke="#03143A" stroke-width="4.4" stroke-linecap="round"/>
    <circle r="4.4" fill="#03143A"/>
  </g>
