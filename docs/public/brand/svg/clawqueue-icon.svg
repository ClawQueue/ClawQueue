<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="ClawQueue icon">
  <title>ClawQueue</title>
  <defs>
    <linearGradient id="cqClaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A33"/>
      <stop offset=".55" stop-color="#FF4A12"/>
      <stop offset="1" stop-color="#C8260A"/>
    </linearGradient>
    <linearGradient id="cqDial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE0FF"/>
      <stop offset="1" stop-color="#0EA8DD"/>
    </linearGradient>
    <radialGradient id="cqDialGlow" cx=".5" cy=".5" r=".55">
      <stop offset=".55" stop-color="#5BE0FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#1EC6FF" stop-opacity=".55"/>
    </radialGradient>
    <mask id="cqClawCut" maskUnits="userSpaceOnUse">
      <rect width="256" height="256" fill="#000"/>
      <circle cx="128" cy="128" r="108" fill="#fff"/>
      <circle cx="128" cy="128" r="62" fill="#000"/>
      <polygon points="128,128 270,42 270,214" fill="#000"/>
      <rect x="118" y="124" width="160" height="8" fill="#000"/>
    </mask>
    <linearGradient id="cqShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="234" rx="80" ry="6" fill="#03143A" opacity=".10"/>
  <g mask="url(#cqClawCut)">
    <rect width="256" height="256" fill="url(#cqClaw)"/>
    <rect width="256" height="256" fill="url(#cqShade)"/>
  </g>
  <g transform="translate(180 128)">
    <circle r="48" fill="url(#cqDialGlow)"/>
    <circle r="40" fill="#03143A"/>
    <circle r="34" fill="url(#cqDial)"/>
    <g stroke="#03143A" stroke-width="2.4" stroke-linecap="round" fill="none">
      <line x1="0" y1="-29" x2="0" y2="-23"/>
      <line x1="20.5" y1="-20.5" x2="16.3" y2="-16.3"/>
      <line x1="29" y1="0" x2="23" y2="0"/>
      <line x1="20.5" y1="20.5" x2="16.3" y2="16.3"/>
      <line x1="0" y1="29" x2="0" y2="23"/>
      <line x1="-20.5" y1="20.5" x2="-16.3" y2="16.3"/>
      <line x1="-29" y1="0" x2="-23" y2="0"/>
      <line x1="-20.5" y1="-20.5" x2="-16.3" y2="-16.3"/>
    </g>
    <line x1="0" y1="0" x2="15" y2="-19" stroke="#03143A" stroke-width="3.6" stroke-linecap="round"/>
    <circle r="3.6" fill="#03143A"/>
  </g>
</svg>
