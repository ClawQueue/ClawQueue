<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="ClawQueue">
  <title>ClawQueue</title>
  <defs>
    <linearGradient id="h_claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A33"/>
      <stop offset=".55" stop-color="#FF4A12"/>
      <stop offset="1" stop-color="#C8260A"/>
    </linearGradient>
    <linearGradient id="h_dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE0FF"/>
      <stop offset="1" stop-color="#0EA8DD"/>
    </linearGradient>
    <radialGradient id="h_glow" cx=".5" cy=".5" r=".55">
      <stop offset=".55" stop-color="#5BE0FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#1EC6FF" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="h_shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <mask id="h_cut" maskUnits="userSpaceOnUse">
      <rect width="220" height="220" fill="#000"/>
      <circle cx="110" cy="110" r="93" fill="#fff"/>
      <circle cx="110" cy="110" r="53" fill="#000"/>
      <polygon points="110,110 235,36 235,184" fill="#000"/>
      <rect x="100" y="106" width="140" height="8" fill="#000"/>
    </mask>
    <style>
      .cq-wm-h{font-family:'Outfit','Space Grotesk','Inter','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:120px;letter-spacing:-4px}
      .h-claw{fill:#E83A12}.h-queue{fill:#03143A}
      .cq-tag{font-family:'JetBrains Mono','JetBrains Mono','SFMono-Regular',ui-monospace,monospace;font-size:18px;letter-spacing:5px;fill:#5E6A7D}
    </style>
  </defs>
  <g>
    <g mask="url(#h_cut)">
      <rect width="220" height="220" fill="url(#h_claw)"/>
      <rect width="220" height="220" fill="url(#h_shade)"/>
    </g>
    <g transform="translate(155 110)">
      <circle r="40" fill="url(#h_glow)"/>
      <circle r="33" fill="#03143A"/>
      <circle r="28" fill="url(#h_dial)"/>
      <g stroke="#03143A" stroke-width="2" stroke-linecap="round" fill="none">
        <line x1="0" y1="-24" x2="0" y2="-19"/>
        <line x1="17" y1="-17" x2="13.5" y2="-13.5"/>
        <line x1="24" y1="0" x2="19" y2="0"/>
        <line x1="17" y1="17" x2="13.5" y2="13.5"/>
        <line x1="0" y1="24" x2="0" y2="19"/>
        <line x1="-17" y1="17" x2="-13.5" y2="13.5"/>
        <line x1="-24" y1="0" x2="-19" y2="0"/>
        <line x1="-17" y1="-17" x2="-13.5" y2="-13.5"/>
      </g>
      <line x1="0" y1="0" x2="13" y2="-16" stroke="#03143A" stroke-width="3" stroke-linecap="round"/>
      <circle r="3" fill="#03143A"/>
    </g>
  </g>
  <text class="cq-wm-h" x="250" y="142">
    <tspan class="h-claw">Claw</tspan><tspan class="h-queue">Queue</tspan>
  </text>
  <text class="cq-tag" x="252" y="180">LOCAL · OPERATOR · v0</text>
</svg>
