<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="ClawQueue">
  <title>ClawQueue</title>
  <defs>
    <linearGradient id="s_claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A33"/>
      <stop offset=".55" stop-color="#FF4A12"/>
      <stop offset="1" stop-color="#C8260A"/>
    </linearGradient>
    <linearGradient id="s_dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE0FF"/>
      <stop offset="1" stop-color="#0EA8DD"/>
    </linearGradient>
    <radialGradient id="s_glow" cx=".5" cy=".5" r=".55">
      <stop offset=".55" stop-color="#5BE0FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#1EC6FF" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="s_shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <mask id="s_cut" maskUnits="userSpaceOnUse">
      <rect x="120" y="40" width="240" height="240" fill="#000"/>
      <circle cx="240" cy="160" r="102" fill="#fff"/>
      <circle cx="240" cy="160" r="58" fill="#000"/>
      <polygon points="240,160 380,76 380,244" fill="#000"/>
      <rect x="230" y="156" width="160" height="8" fill="#000"/>
    </mask>
    <style>
      .cq-wm-s{font-family:'Outfit','Space Grotesk','Inter','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:80px;letter-spacing:-3px}
      .s-claw{fill:#E83A12}.s-queue{fill:#03143A}
      .cq-tag-s{font-family:'JetBrains Mono','JetBrains Mono','SFMono-Regular',ui-monospace,monospace;font-size:14px;letter-spacing:6px;fill:#5E6A7D;text-anchor:middle}
    </style>
  </defs>
  <g mask="url(#s_cut)">
    <rect x="120" y="40" width="240" height="240" fill="url(#s_claw)"/>
    <rect x="120" y="40" width="240" height="240" fill="url(#s_shade)"/>
  </g>
  <g transform="translate(290 160)">
    <circle r="44" fill="url(#s_glow)"/>
    <circle r="36" fill="#03143A"/>
    <circle r="30" fill="url(#s_dial)"/>
    <g stroke="#03143A" stroke-width="2.2" stroke-linecap="round" fill="none">
      <line x1="0" y1="-26" x2="0" y2="-20"/>
      <line x1="18" y1="-18" x2="14.3" y2="-14.3"/>
      <line x1="26" y1="0" x2="20" y2="0"/>
      <line x1="18" y1="18" x2="14.3" y2="14.3"/>
      <line x1="0" y1="26" x2="0" y2="20"/>
      <line x1="-18" y1="18" x2="-14.3" y2="14.3"/>
      <line x1="-26" y1="0" x2="-20" y2="0"/>
      <line x1="-18" y1="-18" x2="-14.3" y2="-14.3"/>
    </g>
    <line x1="0" y1="0" x2="13" y2="-17" stroke="#03143A" stroke-width="3.2" stroke-linecap="round"/>
    <circle r="3.2" fill="#03143A"/>
  </g>
  <text class="cq-wm-s" x="240" y="380" text-anchor="middle">
    <tspan class="s-claw">Claw</tspan><tspan class="s-queue">Queue</tspan>
  </text>
  <text class="cq-tag-s" x="240" y="420">LOCAL · OPERATOR · v0</text>
</svg>
